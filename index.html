<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#16181d" />
    <title>CAD.remeslo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="projects-btn" data-cmd="projects" title="Проекты">☰</button>
        <button id="project-name" data-cmd="rename" title="Переименовать проект">Проект</button>
        <span id="save-state"></span>
        <span id="status">Загрузка CAD-ядра…</span>
        <div class="spacer"></div>
        <button data-cmd="panel" title="Панель свойств">▤</button>
        <button data-cmd="settings" title="Настройки">⚙</button>
        <button data-cmd="snap" title="Привязка к сетке (G)">▦</button>
        <button data-cmd="theme" title="Светлая / тёмная тема">☾</button>
        <button data-cmd="undo" title="Отменить (Ctrl+Z)">↶</button>
        <button data-cmd="redo" title="Повторить (Ctrl+Y)">↷</button>
        <button data-cmd="history" title="История шагов (H)">🕘</button>
        <button data-cmd="fit" title="Показать всё">⤢</button>
      </header>

      <nav id="toolbar">
        <div class="group-label">Выбор</div>
        <div class="pick-modes">
          <button data-cmd="pick-auto" title="Авто: грань или ребро под пером, двойное касание — тело (A)">Авто</button>
          <button data-cmd="pick-body" title="Только тела (B)">Тело</button>
          <button data-cmd="pick-face" title="Только грани (F)">Грань</button>
          <button data-cmd="pick-edge" title="Только рёбра (E)">Ребро</button>
        </div>
        <!-- Группы инструментов строятся в main.ts: кнопка группы + выдвижное меню -->
        <div id="tool-groups"></div>
      </nav>

      <main id="viewport">
        <div id="empty-state" style="display: none">
          <h2>Начните модель</h2>
          <div class="empty-actions">
            <button data-cmd="sketch"><span class="ico">✎</span>Эскиз</button>
            <button data-cmd="cube"><span class="ico">▣</span>Куб</button>
            <button data-cmd="cylinder"><span class="ico">⬭</span>Цилиндр</button>
            <button data-cmd="import"><span class="ico">⇧</span>Открыть файл</button>
          </div>
          <p>Эскиз рисуется пером на плоскости, потом вытягивается в тело.</p>
        </div>
        <div id="timeline" style="display: none"></div>
        <div id="op-panel" style="display: none"></div>
      </main>

      <aside id="panel">
        <section id="props"></section>
        <details id="tree" class="sect">
          <summary>Объекты <span id="tree-count" class="count"></span></summary>
          <h3>Тела</h3>
          <ul id="body-list"></ul>
          <h3 id="sketch-head">Эскизы</h3>
          <ul id="sketch-list"></ul>
          <h3 id="plane-head">Плоскости</h3>
          <ul id="plane-list"></ul>
        </details>
      </aside>
    </div>

    <div id="projects" class="hidden">
      <header>
        <h2>Проекты</h2>
        <div class="spacer"></div>
        <button data-cmd="open-file">Открыть файл…</button>
        <button data-cmd="close-projects">Закрыть</button>
      </header>
      <div id="project-grid"></div>
    </div>
    <input id="file-input" type="file" accept=".remeslo,.tabcad,.json,.step,.stp,.stl" hidden />

    <div id="loader"><div class="spinner"></div><div>Загрузка CAD-ядра OpenCascade…</div></div>
    <div id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
